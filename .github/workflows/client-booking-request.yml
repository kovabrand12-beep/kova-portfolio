name: Appointment — client request (from booking page)

# Fired by the public booking page via a repository_dispatch call.
# Creates a PENDING appointment, emails Kova a heads-up, acknowledges the client.
# Then a human runs "Appointment — confirm / add Zoom link".
on:
  repository_dispatch:
    types: [booking-request]

concurrency:
  group: appointments-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Record request
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          INTERNAL_NOTIFY: ${{ secrets.INTERNAL_NOTIFY }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          SITE_URL: ${{ vars.SITE_URL }}
          APT_NAME: ${{ github.event.client_payload.name }}
          APT_EMAIL: ${{ github.event.client_payload.email }}
          APT_START: ${{ github.event.client_payload.start }}
          APT_TIMEZONE: ${{ github.event.client_payload.timezone }}
          APT_NOTES: ${{ github.event.client_payload.notes }}
        run: node automation/request.js
      - name: Commit appointments.json
        run: |
          git config user.name "kova-bot"
          git config user.email "actions@github.com"
          git add automation/appointments.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(appointments): new client request"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 5
          done
