name: Appointment — confirm / add Zoom link

# Use this to turn a PENDING request (from the public booking page) into a
# confirmed appointment by attaching a Zoom link.
on:
  workflow_dispatch:
    inputs:
      id:
        description: "Appointment id (from the request email). Preferred."
        required: false
        default: ""
      email:
        description: "…or the client email (used only if id is blank; must be a single pending request)"
        required: false
        default: ""
      zoom:
        description: "Zoom (or Meet/Teams) meeting link"
        required: true
      start:
        description: 'Optional: new start time "YYYY-MM-DD HH:MM" if it changed'
        required: false
        default: ""
      timezone:
        description: "Optional: new IANA timezone if it changed"
        required: false
        default: ""

concurrency:
  group: appointments-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Confirm appointment
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          INTERNAL_NOTIFY: ${{ secrets.INTERNAL_NOTIFY }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          SITE_URL: ${{ vars.SITE_URL }}
          APT_ID: ${{ inputs.id }}
          APT_EMAIL: ${{ inputs.email }}
          APT_ZOOM: ${{ inputs.zoom }}
          APT_START: ${{ inputs.start }}
          APT_TIMEZONE: ${{ inputs.timezone }}
        run: node automation/confirm.js
      - name: Commit appointments.json
        run: |
          git config user.name "kova-bot"
          git config user.email "actions@github.com"
          git add automation/appointments.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(appointments): confirm appointment"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 5
          done
