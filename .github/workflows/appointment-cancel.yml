name: Appointment — cancel

on:
  workflow_dispatch:
    inputs:
      id:
        description: "Appointment id to cancel. Preferred."
        required: false
        default: ""
      email:
        description: "…or client email (cancels their next upcoming appointment)"
        required: false
        default: ""
      silent:
        description: "Skip the cancellation email to the client"
        type: boolean
        default: false

concurrency:
  group: appointments-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Cancel appointment
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          SITE_URL: ${{ vars.SITE_URL }}
          APT_ID: ${{ inputs.id }}
          APT_EMAIL: ${{ inputs.email }}
          APT_SILENT: ${{ inputs.silent }}
        run: node automation/cancel.js
      - name: Commit appointments.json
        run: |
          git config user.name "kova-bot"
          git config user.email "actions@github.com"
          git add automation/appointments.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(appointments): cancel appointment"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 5
          done
