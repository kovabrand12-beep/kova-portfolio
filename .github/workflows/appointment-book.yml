name: Appointment — book (send Zoom link + arm reminders)

# Manual/admin path: you already have a Zoom link. Fill this in and Run workflow.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Client full name"
        required: true
      email:
        description: "Client email address"
        required: true
      start:
        description: 'Start time, "YYYY-MM-DD HH:MM" in 24h (e.g. 2026-09-12 15:00)'
        required: true
      timezone:
        description: "IANA timezone (e.g. America/New_York). Blank = repo default."
        required: false
        default: ""
      zoom:
        description: "Zoom (or Meet/Teams) meeting link"
        required: true
      notes:
        description: "Optional note shown to the client"
        required: false
        default: ""

concurrency:
  group: appointments-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Book appointment
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          INTERNAL_NOTIFY: ${{ secrets.INTERNAL_NOTIFY }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          SITE_URL: ${{ vars.SITE_URL }}
          APT_NAME: ${{ inputs.name }}
          APT_EMAIL: ${{ inputs.email }}
          APT_START: ${{ inputs.start }}
          APT_TIMEZONE: ${{ inputs.timezone }}
          APT_ZOOM: ${{ inputs.zoom }}
          APT_NOTES: ${{ inputs.notes }}
        run: node automation/book.js
      - name: Commit appointments.json
        run: |
          git config user.name "kova-bot"
          git config user.email "actions@github.com"
          git add automation/appointments.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(appointments): book appointment"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 5
          done
