<html lang="en">
<head>
<meta charset="UTF-8">

</head>
<body>

<a href="../../index.html" class="back-to-kova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Kova</a>

<div class="wrap">
  <header>
    <a class="brand" href="index.html">Summit <span>Fitness</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="schedule.html" class="active">Schedule</a>
      <a href="membership.html">Membership</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="btn btn-primary" href="membership.html">Join now</a>
  </header>
</div>

<section style="padding-top:20px;">
  <div class="wrap">
    <div class="section-label">This week</div>
    <h2>Class schedule</h2>
    <div class="tabs" id="dayTabs">
      <button class="tab-btn active" data-day="mon">Mon</button>
      <button class="tab-btn" data-day="tue">Tue</button>
      <button class="tab-btn" data-day="wed">Wed</button>
      <button class="tab-btn" data-day="thu">Thu</button>
      <button class="tab-btn" data-day="fri">Fri</button>
      <button class="tab-btn" data-day="sat">Sat</button>
    </div>
    <div class="class-list" id="classList"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    Built by <a href="../../index.html">Kova</a>
  </div>
</footer>

<script>
  const schedule = {
    mon: [["6:00am","Strength","Coach Reyes"],["9:00am","Conditioning","Coach Reyes"],["5:30pm","Strength","Coach Iyer"],["6:30pm","Open Gym","—"]],
    tue: [["6:00am","Conditioning","Coach Iyer"],["9:00am","Mobility","Coach Park"],["5:30pm","Strength","Coach Reyes"]],
    wed: [["6:00am","Strength","Coach Reyes"],["9:00am","Conditioning","Coach Park"],["5:30pm","Strength","Coach Iyer"],["6:30pm","Open Gym","—"]],
    thu: [["6:00am","Conditioning","Coach Iyer"],["9:00am","Mobility","Coach Park"],["5:30pm","Strength","Coach Reyes"]],
    fri: [["6:00am","Strength","Coach Reyes"],["9:00am","Conditioning","Coach Park"],["5:00pm","Open Gym","—"]],
    sat: [["8:00am","Team Conditioning","Coach Iyer"],["9:30am","Open Gym","—"]],
  };

  const list = document.getElementById("classList");
  const tabs = document.querySelectorAll(".tab-btn");

  function render(day) {
    list.innerHTML = "";
    schedule[day].forEach(([time, name, coach]) => {
      const row = document.createElement("div");
      row.className = "class-row";
      row.innerHTML = `<div class="time">${time}</div><div class="name">${name}</div><div class="coach">${coach}</div>`;
      list.appendChild(row);
    });
  }

  tabs.forEach(btn => {
    btn.addEventListener("click", () => {
      tabs.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render(btn.dataset.day);
    });
  });

  render("mon");
</script>

<script src="../../assets/reveal.js"></script>
</body>
</html>
