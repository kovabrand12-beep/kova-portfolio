<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Demo — PulseOps | Kova</title>
<link rel="stylesheet" href="../../assets/back-button.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="../../index.html" class="back-to-kova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Kova</a>

<header>
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span>PulseOps</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <a class="btn btn-outline" href="pricing.html">Start free trial</a>
  </div>
</header>

<section style="padding-top:90px;">
  <div class="wrap" style="max-width:560px;">
    <div class="section-head" style="text-align:left; margin-bottom:34px;">
      <h2>Book a demo</h2>
      <p>Walk through PulseOps with someone from the team — 20 minutes, no pressure.</p>
    </div>

    <div class="mock" style="text-align:left;">
      <div class="field">
        <label>Team size</label>
        <select id="dmSize">
          <option>1–5 engineers</option>
          <option>6–20 engineers</option>
          <option>21–50 engineers</option>
          <option>50+ engineers</option>
        </select>
      </div>
      <div class="two-col">
        <div class="field">
          <label>Preferred date</label>
          <input type="date" id="dmDate">
        </div>
        <div class="field">
          <label>Preferred time</label>
          <select id="dmTime">
            <option>9:00 AM</option>
            <option>11:00 AM</option>
            <option>1:00 PM</option>
            <option>3:00 PM</option>
            <option>5:00 PM</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Work email</label>
        <input type="email" id="dmEmail" placeholder="you@company.com">
      </div>
      <a href="#" id="dmSubmit" class="btn btn-primary" style="display:block; text-align:center; width:100%; box-sizing:border-box;">Book demo call</a>
      <div class="dm-result" id="dmResult"></div>
    </div>

    <p style="color:var(--muted); margin-top:24px; font-size:0.9rem;">Prefer async? <a href="mailto:kova.brand12@gmail.com" style="color:var(--accent-2);">kova.brand12@gmail.com</a></p>
  </div>
</section>

<footer>
  <div class="wrap">
    Built by <a href="../../index.html">Kova</a>
  </div>
</footer>

<script>
  document.getElementById('dmSubmit').addEventListener('click', (e) => {
    e.preventDefault();
    const size = document.getElementById('dmSize').value;
    const date = document.getElementById('dmDate').value;
    const time = document.getElementById('dmTime').value;
    const result = document.getElementById('dmResult');
    if (!date) {
      result.textContent = 'Pick a date to book your demo call.';
    } else {
      const d = new Date(date + 'T00:00:00');
      const formatted = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      result.innerHTML = `Demo booked for <strong>${formatted} at ${time}</strong> — calendar invite on its way. (Team size noted: ${size}.)`;
    }
    result.classList.add('show');
  });
</script>

<script src="../../assets/reveal.js"></script>
</body>
</html>
