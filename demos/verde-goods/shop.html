<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Verde Goods | Kova</title>
<link rel="stylesheet" href="../../assets/back-button.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="../../index.html" class="back-to-kova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Kova</a>

<header>
  <div class="wrap">
    <a class="brand" href="index.html">Verde <span>Goods</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <button class="cart-btn" id="cartBtn">Cart <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<section style="padding-top:60px;">
  <div class="wrap">
    <h2>Best sellers</h2>
    <div class="product-grid" id="productGrid"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    Built by <a href="../../index.html">Kova</a>
  </div>
</footer>

<div class="toast" id="toast">Added to cart</div>

<script>
  const products = [
    { name: "Monstera Deliciosa", price: "$42", meta: "Medium light", emoji: "🌿" },
    { name: "Snake Plant", price: "$28", meta: "Low light", emoji: "🪴" },
    { name: "Pothos, Golden", price: "$22", meta: "Any light", emoji: "🌱" },
    { name: "Fiddle Leaf Fig", price: "$65", meta: "Bright, indirect", emoji: "🌳" },
    { name: "ZZ Plant", price: "$34", meta: "Low light", emoji: "🪴" },
    { name: "Ceramic Planter, Small", price: "$18", meta: "Drainage included", emoji: "🏺" },
    { name: "Watering Can", price: "$24", meta: "1L, stainless", emoji: "🚿" },
    { name: "Plant Food, 8oz", price: "$12", meta: "All-purpose", emoji: "🧴" },
  ];

  const grid = document.getElementById("productGrid");
  const toast = document.getElementById("toast");
  const cartCount = document.getElementById("cartCount");
  let count = 0;

  products.forEach(p => {
    const el = document.createElement("div");
    el.className = "product reveal";
    el.innerHTML = `
      <div class="product-img">${p.emoji}</div>
      <div class="product-info">
        <h3>${p.name}</h3>
        <div class="price">${p.price}</div>
        <div class="meta">${p.meta}</div>
        <button class="add-btn">Add to cart</button>
      </div>
    `;
    el.querySelector(".add-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      count++;
      cartCount.textContent = count;
      toast.textContent = `Added "${p.name}" to cart`;
      toast.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
    });
    grid.appendChild(el);
  });
</script>

<script src="../../assets/reveal.js"></script>
</body>
</html>
