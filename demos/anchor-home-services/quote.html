<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote — Anchor Home Services | Kova</title>
<link rel="stylesheet" href="../../assets/back-button.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="../../index.html" class="back-to-kova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Kova</a>

<header>
  <div class="wrap">
    <a class="brand" href="index.html">Anchor <span>Home Services</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="quote.html" class="active">Get a quote</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="btn btn-outline" href="quote.html">Get a free quote</a>
  </div>
</header>

<section class="quote-band" style="border-top:none; padding-top:60px;">
  <div class="wrap">
    <div class="section-head reveal">
      <h2>Get an instant estimate</h2>
      <p>A ballpark range in seconds — a technician will confirm the exact price on site.</p>
    </div>
    <div class="quote-box reveal">
      <div class="quote-row">
        <div>
          <label>Service needed</label>
          <select id="qService">
            <option value="150-350">Plumbing repair</option>
            <option value="200-600">Electrical work</option>
            <option value="250-900">HVAC service</option>
            <option value="100-300">Handyman task</option>
          </select>
        </div>
        <div>
          <label>How soon?</label>
          <select id="qUrgency">
            <option value="1">Standard (2–3 days)</option>
            <option value="1.3">Priority (next day)</option>
            <option value="1.6">Emergency (today)</option>
          </select>
        </div>
      </div>
      <div class="quote-row">
        <div>
          <label>ZIP code</label>
          <input type="text" id="qZip" placeholder="e.g. 94110" maxlength="10">
        </div>
        <div>
          <label>Phone</label>
          <input type="tel" id="qPhone" placeholder="(555) 555-5555">
        </div>
      </div>
      <a class="btn btn-navy" href="#" id="qCalc" style="width:100%; text-align:center; box-sizing:border-box; display:block;">Calculate estimate</a>
      <div class="quote-result" id="qResult"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    Built by <a href="../../index.html">Kova</a>
  </div>
</footer>

<script>
  document.getElementById('qCalc').addEventListener('click', (e) => {
    e.preventDefault();
    const [lo, hi] = document.getElementById('qService').value.split('-').map(Number);
    const mult = parseFloat(document.getElementById('qUrgency').value);
    const zip = document.getElementById('qZip').value.trim();
    const result = document.getElementById('qResult');
    if (!zip) {
      result.innerHTML = 'Enter a ZIP code to calculate your estimate.';
    } else {
      const low = Math.round((lo * mult) / 5) * 5;
      const high = Math.round((hi * mult) / 5) * 5;
      result.innerHTML = `Estimated range for ${zip}: <span class="amount">$${low} – $${high}</span><br>A dispatcher will confirm details before any work begins.`;
    }
    result.classList.add('show');
  });
</script>

<script src="../../assets/reveal.js"></script>
</body>
</html>
