<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listings — Northbeam Realty | Kova</title>
<link rel="stylesheet" href="../../assets/back-button.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="../../index.html" class="back-to-kova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Kova</a>

<header>
  <div class="wrap inner">
    <a class="brand" href="index.html">Northbeam <span>Realty</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="listings.html" class="active">Listings</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <a class="btn btn-primary" href="contact.html">Schedule a showing</a>
  </div>
</header>

<section style="padding-top:50px;">
  <div class="wrap">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-type="all">All</button>
      <button class="filter-btn" data-type="house">Houses</button>
      <button class="filter-btn" data-type="condo">Condos</button>
      <button class="filter-btn" data-type="townhouse">Townhouses</button>
    </div>
    <div class="listing-grid" id="listingGrid"></div>
    <div class="empty-state" id="emptyState">No listings match that filter right now.</div>
  </div>
</section>

<footer>
  <div class="wrap">
    Built by <a href="../../index.html">Kova</a>
  </div>
</footer>

<script>
  const listings = [
    { type: "house", price: "$685,000", addr: "412 Alder Court", meta: "4 bd · 3 ba · 2,340 sqft", grad: "135deg,#2c3e5c,#0f1723" },
    { type: "condo", price: "$329,000", addr: "88 Harbor View #6B", meta: "2 bd · 2 ba · 1,020 sqft", grad: "135deg,#3a4f6b,#182233" },
    { type: "townhouse", price: "$459,000", addr: "27 Cedarbrook Row", meta: "3 bd · 2.5 ba · 1,680 sqft", grad: "135deg,#4a5d3a,#1c2417" },
    { type: "house", price: "$812,500", addr: "1560 Ridgeline Drive", meta: "5 bd · 4 ba · 3,120 sqft", grad: "135deg,#5c4a2c,#241d10" },
    { type: "condo", price: "$275,000", addr: "410 Marina Plaza #12", meta: "1 bd · 1 ba · 740 sqft", grad: "135deg,#39506b,#141c28" },
    { type: "townhouse", price: "$399,000", addr: "9 Willowmere Lane", meta: "3 bd · 2 ba · 1,540 sqft", grad: "135deg,#4a3f5c,#1c1824" },
    { type: "house", price: "$549,900", addr: "231 Foxglove Street", meta: "3 bd · 2 ba · 1,860 sqft", grad: "135deg,#2c4a4a,#101f1f" },
    { type: "condo", price: "$395,000", addr: "77 Seaport Tower #21A", meta: "2 bd · 2 ba · 1,150 sqft", grad: "135deg,#3a3a5c,#161624" },
  ];

  const grid = document.getElementById("listingGrid");
  const empty = document.getElementById("emptyState");

  function render(filter) {
    const shown = filter === "all" ? listings : listings.filter(l => l.type === filter);
    grid.innerHTML = "";
    empty.style.display = shown.length ? "none" : "block";
    shown.forEach(l => {
      const el = document.createElement("div");
      el.className = "listing";
      el.innerHTML = `
        <div class="listing-img" style="background: linear-gradient(${l.grad});">🏠</div>
        <div class="listing-body">
          <div class="listing-price">${l.price}</div>
          <div class="listing-addr">${l.addr}</div>
          <div class="listing-meta">${l.meta}</div>
          <span class="listing-tag">${l.type}</span>
        </div>
      `;
      grid.appendChild(el);
    });
  }

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render(btn.dataset.type);
    });
  });

  render("all");
</script>

<script src="../../assets/reveal.js"></script>
</body>
</html>
