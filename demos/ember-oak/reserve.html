<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserve — Ember & Oak | Kova</title>
<link rel="stylesheet" href="../../assets/back-button.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a href="../../index.html" class="back-to-kova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back to Kova</a>

<header>
  <div class="wrap">
    <a class="brand" href="index.html">Ember <span>&amp;</span> Oak</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="reserve.html" class="active">Reserve</a>
      <a href="visit.html">Visit</a>
    </nav>
    <a class="btn" href="reserve.html">Reserve a table</a>
  </div>
</header>

<section style="border-top:none; padding-top:60px;">
  <div class="wrap">
    <div class="section-head">
      <span class="kicker">Reservations</span>
      <h2>Book a table</h2>
    </div>
    <div class="reserve-box reveal">
      <div class="reserve-row">
        <div>
          <label>Date</label>
          <input type="date" id="resDate">
        </div>
        <div>
          <label>Time</label>
          <select id="resTime">
            <option>5:30 PM</option>
            <option>6:00 PM</option>
            <option>6:30 PM</option>
            <option>7:00 PM</option>
            <option>7:30 PM</option>
            <option>8:00 PM</option>
            <option>8:30 PM</option>
          </select>
        </div>
        <div>
          <label>Party size</label>
          <select id="resSize">
            <option>2 guests</option>
            <option>3 guests</option>
            <option>4 guests</option>
            <option>5 guests</option>
            <option>6+ guests</option>
          </select>
        </div>
      </div>
      <a class="btn" href="#" id="resCheck" style="width:100%; text-align:center; box-sizing:border-box;">Check availability</a>
      <div class="reserve-result" id="resResult"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    Built by <a href="../../index.html">Kova</a>
  </div>
</footer>

<script>
  document.getElementById('resCheck').addEventListener('click', (e) => {
    e.preventDefault();
    const date = document.getElementById('resDate').value;
    const time = document.getElementById('resTime').value;
    const size = document.getElementById('resSize').value;
    const result = document.getElementById('resResult');
    if (!date) {
      result.textContent = 'Pick a date to check availability.';
    } else {
      const d = new Date(date + 'T00:00:00');
      const formatted = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      result.textContent = `A table for ${size} is available on ${formatted} at ${time}.`;
    }
    result.classList.add('show');
  });
</script>

<script src="../../assets/reveal.js"></script>
</body>
</html>
